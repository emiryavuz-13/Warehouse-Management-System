<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="İstif">
  <title>İstif</title>
  <!-- Raf: her şeyin üstünde durduğu yer -->
  <rect x="5.5" y="38" width="37" height="4" rx="2" fill="#16191f"/>
  <!-- İ'nin gövdesi / rafta duran koli -->
  <rect x="8.5" y="20.5" width="11" height="17" rx="2.5" fill="#16191f"/>
  <!-- Yanındaki koli -->
  <rect x="22.5" y="26.5" width="17" height="11" rx="2.5" fill="#8e99a9"/>
  <!-- İ'nin noktası / yerleşmeyi bekleyen koli -->
  <rect x="8.5" y="6" width="11" height="11" rx="2.5" fill="#1f5fd6"/>
</svg>
